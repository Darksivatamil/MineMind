name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: node --check main.js
      - run: for f in $(find src -name "*.js"); do node --check "$f" || exit 1; done
      - run: node -e "for(const f of ['config/settings.example.json','src/knowledge/minecraft_knowledge.json'])JSON.parse(require('fs').readFileSync(f,'utf8'));console.log('JSON OK')"
      - run: grep -rEn "nvapi-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{20,}" --include="*.js" --include="*.json" --exclude-dir=node_modules . && echo "LEAKED KEY FOUND" && exit 1 || echo "No leaked keys"
